name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: Setup WSL2
        uses: vedantmgoyal9/setup-wsl2@v1.1.0

      - name: disable autocrlf
        run: git config --global core.autocrlf input

      - name: test pre-installed tools
        run: |-

          Set-PSDebug -Trace 2

          wsl which MSBuild.exe
          wsl which python.exe
          wsl which perl.exe

      - name: setup tools
        run: |-

          Set-PSDebug -Trace 2

          choco install nasm
          wsl which nasm.exe

  
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        shell: pwsh
        run: |-

          Set-PSDebug -Trace 2

          wsl sudo apt update
          wsl sudo apt install -y python3 python-is-python3

          wsl bash -e ./buildall.sh 1 $NUMBER_OF_PROCESSORS R N
