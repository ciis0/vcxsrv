name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: Setup WSL2
        uses: vedantmgoyal9/setup-wsl2@v1.1.0

      - name: disable autocrlf
        run: git config --global core.autocrlf input
  
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        shell: powershell
        run: wsl ./buildall.sh 1 $NUMBER_OF_PROCESSORS R N
