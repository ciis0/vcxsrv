name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: WSL Setup
        run: |

          wsl --set-default-version 2
          
          wsl --update
          wsl --status
          
          wsl --install --distribution Ubuntu-24.04
          wsl --set-default Ubuntu-24.04

          wsl cat /etc/os-release

      - uses: actions/checkout@v4

      - name: Run a multi-line scrip
        shell: powershell
        run: |
          wsl ./buildall.cmd 1 $NUMBER_OF_PROCESSORS R N
