name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: Setup WSL2
        uses: vedantmgoyal9/setup-wsl2@v1.1.0
  
      - uses: actions/checkout@v4

      - name: Run a multi-line scrip
        shell: powershell
        run: |
          ./buildall.sh 1 $NUMBER_OF_PROCESSORS R N
